# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: SubfloorMapper
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SubfloorCore:
    path: Packages/SubfloorCore

targets:
  SubfloorMapper:
    type: application
    platform: iOS
    sources:
      - SubfloorMapper
    dependencies:
      - package: SubfloorCore
    info:
      path: SubfloorMapper/Info.plist
      properties:
        CFBundleDisplayName: Subfloor Mapper
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Subfloor Mapper uses the camera and LiDAR scanner to measure high and low spots in the floor.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SubfloorMapper
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  SubfloorMapper:
    build:
      targets:
        SubfloorMapper: all
    test:
      targets:
        - package: SubfloorCore/SubfloorCoreTests
